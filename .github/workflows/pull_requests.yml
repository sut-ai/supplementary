name: Check Pull Request

on:
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Webify
        uses: webifier/build@v1.0.2
        with:
          python-version: "3.13"
          index: index.yml
          baseurl: /supplementary
