prerequisites:
  label: Prerequisites
  background: index/images/supplementary-header.jpg
  content: |
    The supplementary notebooks are written to be approachable, but they assume
    some comfort with the usual mathematical and programming background for an
    artificial intelligence course.

    See the [full prerequisites page](index=pages/prerequisites.yml) for a compact
    checklist and recommended review material.

notebooks:
  label: Notebooks
  background: index/images/supplementary-header.jpg
  content: |
    These notebooks are gateway tutorials for selected artificial intelligence
    topics: short enough to browse, but practical enough to include code,
    examples, visualizations, and pointers for going deeper.

    - [Gradient Descent in Machine Learning](notebook=notebooks/search_in_continuous_space/index.ipynb): Gradient descent, practical challenges, and common improvements.
    - [Convex Optimization](notebook=notebooks/convex_optimization/index.ipynb): Convex optimization fundamentals with a practical image in-painting example using CVXPY.
    - [Prolog and Logic Programming](notebook=notebooks/logic_programming/index.ipynb): Prolog basics and how to use logic programming ideas from Python.
    - [HMM Speech Recognition](notebook=notebooks/hmm_speech_recognition/index.ipynb): Hidden Markov Models for speech recognition, with useful automatic speech recognition tools.
    - [Decision Trees](notebook=notebooks/decision_trees/index.ipynb): Decision trees, pruning, and indexing ideas in classical machine learning.
    - [Robust and Trustworthy Machine Learning](notebook=notebooks/robust_and_trustworthy_machine_learning/index.ipynb): Evasion attacks, poisoning attacks, and defenses for robust ML systems.
    - [Deep Reinforcement Learning](notebook=notebooks/deep_reinforcement_learning/index.ipynb): Early deep-learning approaches to reinforcement learning, including a DQN example.
    - [Transformer](notebook=notebooks/transformer/index.ipynb): Attention, positional encoding, encoder-decoder structure, and transformer sequence modeling.
    - [Dimensionality Reduction](notebook=notebooks/dimensionality_reduction/index.ipynb): PCA, t-SNE, UMAP, and LDA on MNIST for visualizing lower-dimensional structure.
    - [Generative Adversarial Networks](notebook=notebooks/generative_adversarial_networks/index.ipynb): GAN fundamentals, applications, and an anime face generation example.
    - [Machine Learning Methods](notebook=notebooks/ml_methods_online_semisupervised_fewshot_learning/index.ipynb): Online learning, semi-supervised learning, few-shot learning, and meta-learning.
    - [Introduction to Keras](notebook=notebooks/keras/index.ipynb): A practical introduction to Keras for deep learning workflows.
    - [Introduction to Big Data](notebook=notebooks/big_data_intro/index.ipynb): Big data concepts, distributed data processing, and Apache Spark in ML workflows.
    - [MLOps](notebook=notebooks/mlops/index.ipynb): A simple model deployment walkthrough and the engineering ideas around MLOps.
    - [Recurrent Neural Networks](notebook=notebooks/recurrent_neural_networks/index.ipynb): Sequence modeling with recurrent neural networks.
    - [Convolutional Neural Networks](notebook=notebooks/cnn/index.ipynb): CNNs, convolution, pooling, image classification, and TensorFlow training.
    - [AI Applications in Global Warming](notebook=notebooks/global_warming/index.ipynb): How AI can support climate analysis, including CO2 emission prediction.
    - [3D Computer Vision](notebook=notebooks/3d_vision/index.ipynb): Point clouds, 3D vision neural networks, and adversarial attacks.
    - [Generative Adversarial Networks with WGANs](notebook=notebooks/generative_adversarial_networks_wgan/index.ipynb): GANs, conditional GANs, WGAN variants, and PyTorch implementations.
    - [Clustering in Machine Learning](notebook=notebooks/clustering/index.ipynb): Clustering variants and their behavior in unsupervised learning workflows.
    - [Natural Language Processing](notebook=notebooks/natural_language_processing/index.ipynb): NLP challenges and approaches for working with text.

further-readings:
  label: Further Readings
  background: index/images/supplementary-header.jpg
  content: |
    If you want to go deeper than the notebooks, we keep a curated list of
    major public courses and references across computer vision, unsupervised
    learning, reinforcement learning, deep learning, and related topics.

    See the [full further reading page](index=pages/further-reading.yml) for the
    course list.
