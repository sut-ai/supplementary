prerequisites:
  label: Prerequisites
  background: index/images/supplementary-header.jpg
  content: |
    The supplementary notebooks are written to be approachable, but they assume
    some comfort with the usual mathematical and programming background for an
    artificial intelligence course.

    See the [full prerequisites page](index=pages/prerequisites.yml) for a compact
    checklist and recommended review material.

notebooks:
  label: Notebooks
  background: index/images/supplementary-header.jpg
  content: |
    These notebooks are gateway tutorials for selected artificial intelligence
    topics: short enough to browse, but practical enough to include code,
    examples, visualizations, and pointers for going deeper.

    - [Gradient Descent in Machine Learning](notebook=notebooks/search_in_continuous_space/index.ipynb): Gradient descent, its practical challenges, and common improvements.
    - [Convex Optimization](notebook=notebooks/convex_optimization/index.ipynb): Convex optimization fundamentals with a practical image in-painting example using CVXPY.
    - [Prolog and Logic Programming](notebook=notebooks/logic_programming/index.ipynb): Prolog basics and how to use logic programming ideas from Python.
    - [HMM Speech Recognition](notebook=notebooks/hmm_speech_recognition/index.ipynb): Hidden Markov Models for speech recognition, with useful automatic speech recognition tools.
    - [Decision Trees](notebook=notebooks/decision_trees/index.ipynb): Decision trees, pruning, and indexing ideas in classical machine learning.
    - [Robust and Trustworthy Machine Learning](notebook=notebooks/robust_and_trustworthy_machine_learning/index.ipynb): Evasion attacks, poisoning attacks, and defenses for robust ML systems.
    - [Deep Reinforcement Learning](notebook=notebooks/deep_reinforcement_learning/index.ipynb): Early deep-learning approaches to reinforcement learning, including a DQN example.

further-readings:
  label: Further Readings
  background: index/images/supplementary-header.jpg
  content: |
    If you want to go deeper than the notebooks, we keep a curated list of
    major public courses and references across computer vision, unsupervised
    learning, reinforcement learning, deep learning, and related topics.

    See the [full further reading page](index=pages/further-reading.yml) for the
    course list.
