title: Further Reading

header:
  title: Further Reading
  description: Public courses and references for going deeper after the supplementary notebooks.

overview:
  label: Overview
  content: |
    This page collects larger course sequences and reference material that pair
    well with the SUT-AI supplementary notebooks. The goal is not to list
    everything on the internet; it is to point to a few high-quality paths for
    each major topic.

computer_vision:
  label: Computer Vision
  content: |
    - [Stanford CS231n: Deep Learning for Computer Vision](https://cs231n.stanford.edu/)
    - [Michigan EECS 498-007 / 598-005: Deep Learning for Computer Vision](https://web.eecs.umich.edu/~justincj/teaching/eecs498/FA2020/)
    - [UC Berkeley CS280: Computer Vision](https://people.eecs.berkeley.edu/~efros/courses/CS280/)

unsupervised:
  label: Unsupervised and Generative Learning
  content: |
    - [UC Berkeley CS294-158-SP20: Deep Unsupervised Learning](https://sites.google.com/view/berkeley-cs294-158-sp20/home)
    - [Stanford CS236: Deep Generative Models](https://deepgenerativemodels.github.io/)
    - [MIT 6.S978: Deep Generative Models](https://mit-6s978.github.io/)

reinforcement_learning:
  label: Reinforcement Learning
  content: |
    - [UC Berkeley CS285: Deep Reinforcement Learning](https://rail.eecs.berkeley.edu/deeprlcourse/)
    - [UCL / David Silver: Reinforcement Learning](https://www.davidsilver.uk/teaching/)
    - [Stanford CS234: Reinforcement Learning](https://web.stanford.edu/class/cs234/)

deep_learning:
  label: Deep Learning
  content: |
    - [MIT 6.S191: Introduction to Deep Learning](https://introtodeeplearning.com/)
    - [CMU 11-785: Introduction to Deep Learning](https://deeplearning.cs.cmu.edu/)
    - [NYU Deep Learning](https://atcold.github.io/NYU-DLSP20/)
    - [Dive into Deep Learning](https://d2l.ai/)

machine_learning:
  label: Machine Learning Foundations
  content: |
    - [Stanford CS229: Machine Learning](https://cs229.stanford.edu/)
    - [CMU 10-701: Introduction to Machine Learning](https://www.cs.cmu.edu/~mgormley/courses/10701/)
    - [Cornell CS4780: Machine Learning for Intelligent Systems](https://www.cs.cornell.edu/courses/cs4780/)

probabilistic_modeling:
  label: Probabilistic Modeling
  content: |
    - [Stanford CS228: Probabilistic Graphical Models](https://ermongroup.github.io/cs228/)
    - [Probabilistic Machine Learning, Kevin Murphy](https://probml.github.io/pml-book/)
    - [MIT 6.438 Algorithms for Inference](https://ocw.mit.edu/courses/6-438-algorithms-for-inference-fall-2014/)

optimization:
  label: Optimization
  content: |
    - [Stanford EE364a: Convex Optimization](https://web.stanford.edu/class/ee364a/)
    - [Convex Optimization, Boyd and Vandenberghe](https://web.stanford.edu/~boyd/cvxbook/)
    - [CMU 10-725: Convex Optimization](https://www.stat.cmu.edu/~ryantibs/convexopt/)

